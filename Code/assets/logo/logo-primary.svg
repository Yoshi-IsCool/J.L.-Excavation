<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="JL Excavation LLC">
  <title>JL Excavation LLC</title>
  <!-- Stamp / monogram on left -->
  <g transform="translate(0,4)">
    <!-- Octagonal bolt-head stamp -->
    <polygon points="56,0 96,0 112,16 112,96 96,112 56,112 40,96 40,16" fill="#1A1A1A"/>
    <polygon points="56,0 96,0 112,16 112,96 96,112 56,112 40,96 40,16" fill="none" stroke="#F5A623" stroke-width="3" transform="translate(0,0)"/>
    <!-- Inner stamp ring (subtle) -->
    <polygon points="61,8 91,8 104,21 104,91 91,104 61,104 48,91 48,21" fill="none" stroke="#F5A623" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/>
    <!-- JL monogram -->
    <text x="76" y="68" text-anchor="middle" font-family="Anton, 'Bebas Neue', Impact, sans-serif" font-weight="900" font-size="48" fill="#FFFFFF" letter-spacing="2">JL</text>
    <!-- Chevron / dirt line under JL -->
    <polyline points="56,82 76,72 96,82" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="square"/>
    <!-- Tiny year tag -->
    <text x="76" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="7" fill="#F5A623" letter-spacing="1.5">EST. 2005</text>
  </g>
  <!-- Wordmark on right -->
  <g transform="translate(140,0)">
    <text x="0" y="58" font-family="Anton, 'Bebas Neue', Impact, sans-serif" font-weight="900" font-size="56" fill="#1A1A1A" letter-spacing="2">EXCAVATION</text>
    <line x1="0" y1="72" x2="320" y2="72" stroke="#F5A623" stroke-width="3"/>
    <text x="0" y="96" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6E7B89" letter-spacing="6">HEAVY CIVIL  ·  UNDERGROUND  ·  LLC</text>
  </g>
</svg>

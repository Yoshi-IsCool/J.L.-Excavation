<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" role="img" aria-label="JL Earthworks & Design LLC">
  <title>JL Earthworks &amp; Design LLC</title>
  <defs>
    <radialGradient id="flame-grad" cx="40%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FBB034"/>
      <stop offset="35%" stop-color="#F47C2A"/>
      <stop offset="75%" stop-color="#E63E1E"/>
      <stop offset="100%" stop-color="#C71B1F"/>
    </radialGradient>
    <linearGradient id="flame-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBB034"/>
      <stop offset="50%" stop-color="#F47C2A"/>
      <stop offset="100%" stop-color="#E63E1E"/>
    </linearGradient>
  </defs>

  <!-- Swirl / flame mark -->
  <g transform="translate(6,8)">
    <!-- Outer C-sweep -->
    <path d="M 95 55
             C 95 30, 75 10, 50 10
             C 22 10, 5 32, 5 55
             C 5 80, 25 100, 50 100
             C 70 100, 86 90, 92 75
             C 80 88, 60 90, 45 80
             C 30 70, 27 50, 38 38
             C 50 25, 70 28, 78 40
             C 84 48, 84 56, 80 62"
          fill="url(#flame-grad)"/>
    <!-- Inner curl tip -->
    <path d="M 56 40
             C 67 40, 72 50, 68 58
             C 64 65, 55 65, 51 60
             C 48 56, 48 50, 51 47"
          fill="url(#flame-grad-2)" opacity="0.92"/>
    <!-- JL letterform inside flame -->
    <text x="58" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-style="italic" font-size="56" fill="#1A1A1A" letter-spacing="-2">JL</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(120,12)">
    <text x="0" y="48" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#1A1A1A" letter-spacing="-0.5">Earthworks &amp; Design LLC</text>
    <text x="0" y="80" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#C71B1F" letter-spacing="0.4">Built on Integrity, Building with Excellence</text>
  </g>
</svg>
